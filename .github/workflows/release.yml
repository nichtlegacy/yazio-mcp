name: Release

# Tag vX.Y.Z to attach the Claude Desktop bundle to a GitHub release.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build:mcpb
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            yazio-mcp.mcpb
            yazio-mcp.zip
